<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family plan tool</title>
<!--
  Family plan tool, version 2.
  One self-contained file. It works offline; the only thing it fetches is
  the two display fonts from Google Fonts, and if they can't be fetched it
  falls back to fonts already on the computer. Nothing you type is sent
  anywhere. Answers are kept in this browser (IndexedDB "FamilyPlanTool",
  with the localStorage key "FamilyPlanTool.v1" as a fallback) and in
  files you save. To change the sections or questions, edit the CONTENT
  block near the top of the <script> section below.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  /* Layered Paper colours */
  --paper: #E9E0CC;      /* page background */
  --linen: #EFE7D6;      /* cards and panels */
  --parchment: #DCCBAA;  /* recesses, table headers */
  --sand: #C4AC84;
  --khaki: #998C5A;      /* shapes only */
  --sage: #81814F;       /* shapes only */
  --olive: #4D593C;
  --forest: #3E4A30;
  --ink: #2E3322;        /* text */
  --crimson: #6E2A30;    /* accent, sparingly */
  --shadow: 0 2px 6px rgba(40, 34, 20, .22);
  --radius: 2px;
  --display: 'Poiret One', 'Josefin Sans', 'Century Gothic', sans-serif;
  --body: 'Josefin Sans', 'Century Gothic', sans-serif;
  --tint-yes: rgba(77, 89, 60, .13);
  --tint-progress: rgba(196, 172, 132, .42);
  --tint-no: rgba(110, 42, 48, .10);
  font-size: 19px;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-weight: 400; font-size: 1rem; line-height: 1.55;
}
p { margin: 0 0 .8rem; }
strong, b { font-weight: 600; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 2px; }
.skip-link { position: absolute; left: -9999px; top: 0; background: var(--linen); color: var(--ink); padding: .6rem 1rem; z-index: 100; border: 1px solid var(--ink); }
.skip-link:focus { left: 1rem; top: 1rem; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .8rem; line-height: 1.35; }

/* ---------- top bar ---------- */
.topbar { background: var(--linen); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 20; }
.topbar::after { content: ""; display: block; border-top: 1.5px solid var(--olive); border-bottom: .75px solid var(--olive); height: 3px; }
.topbar-inner { max-width: 68rem; margin: 0 auto; padding: .55rem 1.5rem .6rem; }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; justify-content: space-between; }
.bar-row + .bar-row { margin-top: .5rem; }
.brand { display: flex; flex-direction: column; }
.app-title { font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: .9rem; color: var(--forest); margin: 0; }
.save-status { margin: 0; font-size: .9rem; color: var(--ink); }
.save-status.is-error { background: var(--crimson); color: var(--linen); padding: .05rem .5rem; border-radius: var(--radius); }
.bar-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.navline { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; flex: 1 1 36rem; }
.navline .select-wrap { flex: 1 1 18rem; max-width: 30rem; }
.progress { flex: 0 1 19rem; min-width: 14rem; }
.progress-text { margin: 0 0 .3rem; font-size: .9rem; font-weight: 600; }
.pbar { height: .8rem; background: var(--parchment); border: 1px solid var(--khaki); border-radius: var(--radius); overflow: hidden; }
.pfill { height: 100%; width: 0; background: var(--olive); transition: width .3s; }
@media (max-height: 640px), (max-width: 700px) { .topbar { position: static; } }

/* ---------- buttons and controls ---------- */
.btn {
  font-family: var(--body); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; line-height: 1.2;
  min-height: 2.6rem; padding: .7rem 1.1rem .55rem; border-radius: var(--radius); cursor: pointer;
  background: var(--linen); color: var(--ink); border: 1px solid var(--ink); box-shadow: 0 1px 3px rgba(40, 34, 20, .22);
}
.btn:hover { background: var(--parchment); }
.btn:active { box-shadow: none; transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.btn[disabled]:hover { background: var(--linen); }
.btn-primary { background: var(--olive); border-color: var(--forest); color: var(--linen); }
.btn-primary:hover { background: var(--forest); }
.btn-danger { background: var(--crimson); border-color: var(--crimson); color: var(--linen); }
.btn-danger:hover { background: #5A2127; }
.btn-large { font-size: .88rem; padding: .85rem 1.4rem .7rem; }
.btn-small { font-size: .72rem; min-height: 2.1rem; padding: .5rem .7rem .4rem; }
.select {
  font: inherit; font-size: 1rem; color: var(--ink); width: 100%;
  background-color: var(--linen); border: 1px solid var(--ink); border-radius: var(--radius);
  padding: .5rem 2.2rem .4rem .7rem; min-height: 2.6rem; cursor: pointer;
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 1.05rem) 52%, calc(100% - .7rem) 52%;
  background-size: .38rem .38rem; background-repeat: no-repeat;
}
.select option, .select optgroup { background: var(--linen); color: var(--ink); }
.field {
  font: inherit; font-size: 1rem; color: var(--ink); width: 100%; display: block;
  background: var(--linen); border: 1.5px solid var(--khaki); border-radius: var(--radius);
  box-shadow: inset 0 1px 3px rgba(40, 34, 20, .16); padding: .55rem .7rem .45rem; line-height: 1.5;
}
.field:hover { border-color: var(--olive); }
.field:focus { border-color: var(--olive); }
textarea.field { resize: vertical; }
.field::placeholder { color: #6b6a55; opacity: 1; }

/* ---------- page ---------- */
.page { max-width: 68rem; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }
.page:focus { outline: none; }
.card { background: var(--linen); box-shadow: var(--shadow); border-radius: var(--radius); padding: 1.75rem 2.25rem 1.9rem; margin: 0 0 1.75rem; }
@media (max-width: 700px) { .page { padding: 1rem .75rem 3rem; } .card { padding: 1.2rem 1.1rem 1.3rem; } }
.card-title { font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: .95rem; color: var(--olive); margin: 0; }
.rule { border-top: 1.5px solid var(--olive); border-bottom: .75px solid var(--olive); height: 3.5px; margin: .45rem 0 1.25rem; }
.rule-ink { border-color: var(--ink); }
.crumb { color: var(--olive); margin: 0 0 .35rem; }
.section-title, .page-title {
  font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .04em;
  font-size: 2.3rem; line-height: 1.15; margin: 0; color: var(--ink);
}
.page-title { font-size: 2.7rem; }
.section-title:focus, .page-title:focus { outline: none; }
@media (max-width: 700px) { .section-title { font-size: 1.75rem; } .page-title { font-size: 2rem; } }
.lead { font-size: 1.15rem; line-height: 1.55; }
.about p:last-child { margin-bottom: 0; }
.sub-title { font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .85rem; color: var(--olive); margin: 1.5rem 0 .6rem; }

/* notices */
.notice { background: var(--linen); box-shadow: var(--shadow); border-left: 6px solid var(--olive); padding: .9rem 1.2rem; margin: 0 0 1.5rem; }
.notice-error { border-left-color: var(--crimson); font-weight: 600; }
.nr-banner { border-left: 6px solid var(--crimson); background: var(--paper); padding: .75rem 1rem; margin: 1.25rem 0 0; }

/* guidance */
.guidance { margin: 1.5rem 0 0; background: var(--parchment); border-radius: var(--radius); }
.guidance > summary {
  cursor: pointer; list-style: none; padding: .8rem 1.1rem .7rem; display: flex; align-items: center; gap: .7rem;
  font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .85rem;
}
.guidance > summary::-webkit-details-marker { display: none; }
.guidance > summary::before { content: "+"; display: inline-flex; width: 1.5rem; height: 1.5rem; align-items: center; justify-content: center; border: 1px solid var(--ink); border-radius: var(--radius); font-size: 1.1rem; letter-spacing: 0; background: var(--linen); }
.guidance[open] > summary::before { content: "–"; }
.guidance > summary .hint { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .9rem; margin-left: auto; }
.guidance-body { padding: .1rem 1.5rem 1.1rem 1.6rem; border-top: 1px solid var(--sand); }
.guidance-body ul { margin: .5rem 0 .6rem; padding-left: 1.3rem; }
.guidance-body li { margin: .25rem 0; }
.guidance-body p { margin: .6rem 0; }
.guidance-body .g-sub { font-weight: 600; margin-top: 1rem; }
.g-table { border-collapse: collapse; margin: .5rem 0 .9rem; font-size: .95rem; background: var(--linen); }
.g-table th, .g-table td { border: 1px solid var(--khaki); padding: .35rem .6rem; text-align: left; vertical-align: top; }
.g-table th { background: var(--sand); font-weight: 600; }

/* things to think about */
.think { background: var(--paper); border-left: 4px solid var(--sage); border-radius: var(--radius); padding: .65rem 1.1rem .7rem 1.1rem; margin: 0 0 .8rem; font-size: .95rem; }
.think-title { color: var(--olive); margin: 0 0 .2rem; }
.think ul { margin: 0; padding-left: 1.15rem; }
.think li { margin: .2rem 0; }
.think li::marker { color: var(--olive); }
.section-think { margin-bottom: 1.5rem; }
.section-think ul { columns: 1; }

/* questions */
.q { padding: 1.4rem 0 .2rem; border-top: 1px solid var(--sand); }
.q:first-child { border-top: 0; padding-top: .2rem; }
.q-label { display: block; font-weight: 600; font-size: 1.1rem; margin: 0 0 .55rem; }
.part-block { margin-top: 1.6rem; }
.part-block:first-child { margin-top: 0; }

/* tables */
.table-wrap { overflow-x: auto; margin: .2rem 0 .8rem; border-radius: var(--radius); position: relative; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--linen); }
table.grid th, table.grid td { text-align: left; vertical-align: middle; border-bottom: 1px solid rgba(153, 140, 90, .55); }
table.grid thead th {
  background: var(--parchment); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .76rem;
  padding: .7rem .6rem .55rem; border-bottom: 1.5px solid var(--ink); vertical-align: bottom; line-height: 1.3;
}
table.grid tbody th { font-weight: 400; padding: .6rem .75rem .5rem; }
table.grid td { padding: .45rem .5rem; }
table.grid tbody tr:hover { background: rgba(220, 203, 170, .25); }
.res col.c-item { width: auto; }
.res col.c-st { width: 7.2rem; }
.res td.st { text-align: center; padding: .25rem; }
.res thead th.st { text-align: center; }
.res tbody th { box-shadow: inset 6px 0 0 transparent; padding-left: 1rem; }
.res tr.st-yes { background: var(--tint-yes); }
.res tr.st-yes th { box-shadow: inset 6px 0 0 var(--olive); }
.res tr.st-progress { background: var(--tint-progress); }
.res tr.st-progress th { box-shadow: inset 6px 0 0 var(--sand); }
.res tr.st-no, .res tr.st-unsure { background: var(--tint-no); }
.res tr.st-no th, .res tr.st-unsure th { box-shadow: inset 6px 0 0 var(--crimson); }
.res tr.group-row th { background: var(--paper); color: var(--olive); padding: .7rem 1rem .5rem; box-shadow: none; }
.own-tag { font-style: italic; font-weight: 300; font-size: .9rem; margin-left: .35rem; }
.row-label-flex { display: flex; align-items: center; gap: .6rem; justify-content: space-between; }

.tick { display: inline-flex; width: 3rem; height: 2.6rem; align-items: center; justify-content: center; cursor: pointer; }
.tick input {
  appearance: none; -webkit-appearance: none; -moz-appearance: none; margin: 0; cursor: pointer;
  width: 1.55rem; height: 1.55rem; border: 2px solid var(--ink); border-radius: var(--radius); background: var(--linen);
  display: inline-grid; place-content: center;
}
.tick input:hover { box-shadow: 0 0 0 4px rgba(77, 89, 60, .22); }
.tick input::before { content: ""; width: .42rem; height: .8rem; border: solid transparent; border-width: 0 3px 3px 0; transform: translate(0, -2px) rotate(45deg); }
.tick input:checked::before { border-color: var(--linen); }
.tick input.s-yes:checked { background: var(--olive); border-color: var(--olive); }
.tick input.s-progress:checked { background: var(--sand); border-color: var(--ink); }
.tick input.s-progress:checked::before { border-color: var(--ink); }
.tick input.s-no:checked, .tick input.s-unsure:checked { background: var(--crimson); border-color: var(--crimson); }
.tick input:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; }

.data td .cell { font: inherit; font-size: .95rem; color: var(--ink); width: 100%; background: var(--linen); border: 1px solid var(--khaki); border-radius: var(--radius); padding: .4rem .5rem .3rem; line-height: 1.4; }
.data td .cell:hover, .data td .cell:focus { border-color: var(--olive); }
.data td textarea.cell { resize: vertical; min-height: 2.5rem; display: block; }
.data td select.cell { padding-right: 1.8rem; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - .95rem) 55%, calc(100% - .65rem) 55%; background-size: .32rem .32rem; background-repeat: no-repeat; }
.data td select.cell option { background: var(--linen); color: var(--ink); }
.data td select.sv-yes { background-color: var(--olive); color: var(--linen); border-color: var(--olive); }
.data td select.sv-progress { background-color: var(--sand); color: var(--ink); border-color: var(--ink); }
.data td select.sv-no, .data td select.sv-unsure { background-color: var(--crimson); color: var(--linen); border-color: var(--crimson); }
.data td input[type=number].cell { width: 4.6rem; }
.data td.calc { font-size: .95rem; white-space: nowrap; }
.data tbody th { min-width: 10rem; }
.data td.rm { width: 1%; white-space: nowrap; padding-left: .3rem; padding-right: .6rem; }
.data td.rm .btn { font-size: .68rem; padding: .45rem .55rem .35rem; min-height: 2rem; letter-spacing: .06em; }
.data th.c-select { min-width: 7.2rem; } .data th.c-status { min-width: 8rem; } .data th.c-number { min-width: 5rem; }
.data th.c-long { min-width: 11rem; } .data th.c-text { min-width: 9rem; } .data th.c-calc { min-width: 8rem; }
@media (max-width: 1500px) { .card { padding-left: 1.6rem; padding-right: 1.6rem; } }
.col-hint { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .78rem; }
.own-label { font-size: .95rem; }

.table-tools { display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; margin: .4rem 0 0; }
.add-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: flex-end; flex: 1 1 26rem; }
.add-row .field-wrap { flex: 1 1 18rem; }
.add-row label { display: block; margin-bottom: .3rem; }
.table-intro { margin: 0 0 .9rem; }
.table-title { font-weight: 600; font-size: 1.15rem; margin: 0 0 .4rem; }
.data-block { margin: 0 0 2rem; padding-bottom: 1.6rem; border-bottom: 1px solid var(--sand); }

/* mark section */
.marks { display: flex; flex-wrap: wrap; gap: 1rem; }
.mark { display: flex; gap: .8rem; align-items: center; padding: .75rem 1.1rem .65rem; border: 1px solid var(--khaki); border-radius: var(--radius); background: var(--paper); cursor: pointer; font-weight: 600; flex: 1 1 16rem; }
.mark input { appearance: none; -webkit-appearance: none; -moz-appearance: none; margin: 0; width: 1.55rem; height: 1.55rem; border: 2px solid var(--ink); border-radius: var(--radius); background: var(--linen); display: inline-grid; place-content: center; flex: none; cursor: pointer; }
.mark input::before { content: ""; width: .42rem; height: .8rem; border: solid transparent; border-width: 0 3px 3px 0; transform: translate(0, -2px) rotate(45deg); }
.mark input:checked { background: var(--olive); border-color: var(--olive); }
.mark input:checked::before { border-color: var(--linen); }
.mark.nr input:checked { background: var(--crimson); border-color: var(--crimson); }
.mark .mark-help { display: block; font-weight: 400; font-size: .9rem; }
.mark.is-on { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); }
.mark.nr.is-on { border-color: var(--crimson); box-shadow: inset 0 0 0 1px var(--crimson); }

.prev-next { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem; margin: .5rem 0 0; }

/* about page */
.scen-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
@media (max-width: 1000px) { .scen-grid { grid-template-columns: 1fr; } }
.scen { background: var(--paper); border-radius: var(--radius); padding: 1.1rem 1.2rem 1rem; border-top: 4px solid var(--olive); }
.scen-head { display: flex; gap: .8rem; align-items: center; margin-bottom: .7rem; }
.scen-code { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--olive); color: var(--linen); display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 1.6rem; padding-top: .15rem; }
.scen.c .scen-code { background: var(--crimson); }
.scen.c { border-top-color: var(--crimson); }
.scen-title { font-weight: 600; font-size: 1.15rem; }
.scen dl { margin: 0; font-size: .95rem; }
.scen dt { margin: .65rem 0 .1rem; color: var(--olive); }
.scen dd { margin: 0; }
.plain-list { margin: 0; padding-left: 1.3rem; }
.plain-list li { margin: .4rem 0; }
.start-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.2rem; }
.count-table { border-collapse: collapse; margin: .5rem 0 1rem; background: var(--linen); }
.count-table th, .count-table td { border: 1px solid var(--khaki); padding: .4rem .9rem .3rem; text-align: left; }
.count-table th { background: var(--parchment); }
.count-table td.n { text-align: right; font-weight: 600; }
.sw { display: inline-block; width: 1.1rem; height: 1.1rem; vertical-align: -.15rem; margin-right: .5rem; border: 1px solid var(--ink); border-radius: var(--radius); }
.sw-yes { background: var(--olive); } .sw-progress { background: var(--sand); } .sw-no { background: var(--crimson); } .sw-none { background: var(--linen); }

/* dialog */
.dialog { border: 1px solid var(--ink); border-radius: var(--radius); max-width: 34rem; width: calc(100% - 2rem); padding: 1.5rem 1.75rem; color: var(--ink); background: var(--linen); box-shadow: 0 6px 24px rgba(40, 34, 20, .4); }
.dialog::backdrop { background: rgba(46, 51, 34, .55); }
.dialog-title { margin: 0 0 .7rem; font-size: 1.25rem; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .75rem; margin-top: 1.2rem; }
.noscript { padding: 2rem; font-size: 1.2rem; }
@media print { .topbar, .prev-next, .table-tools, .marks { display: none; } .card { box-shadow: none; border: 1px solid var(--khaki); } }
</style>
</head>
<body>
<a class="skip-link" href="#page">Skip to the questions</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="bar-row">
      <div class="brand">
        <p class="app-title">Family plan tool</p>
        <p class="save-status" id="save-status" role="status" aria-live="polite">Not saved yet</p>
      </div>
      <div class="bar-actions">
        <button type="button" class="btn btn-primary" id="btn-save-file">Save to file</button>
        <button type="button" class="btn" id="btn-open">Open a saved file</button>
        <button type="button" class="btn" id="btn-downloads">Download plan</button>
        <button type="button" class="btn btn-danger" id="btn-reset">Start again</button>
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="bar-row">
      <nav class="navline" aria-label="Sections">
        <button type="button" class="btn" id="btn-prev">‹ Previous</button>
        <div class="select-wrap">
          <label for="section-select" class="visually-hidden">Go to a section</label>
          <select id="section-select" class="select"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-next">Next ›</button>
      </nav>
      <div class="progress" id="progress">
        <p class="progress-text" id="progress-text">0 sections done</p>
        <div class="pbar" id="pbar" role="progressbar" aria-labelledby="progress-text" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="pfill" id="pfill"></div></div>
      </div>
    </div>
  </div>
</header>
<main id="page" class="page" tabindex="-1">
  <div id="notice" class="notice" role="alert" hidden></div>
  <div id="view"></div>
</main>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
  <h2 id="dialog-title" class="dialog-title"></h2>
  <div id="dialog-message"></div>
  <div class="dialog-actions">
    <button type="button" class="btn" id="dialog-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="dialog-ok">OK</button>
  </div>
</dialog>
<noscript><p class="noscript">This tool needs JavaScript switched on in Firefox.</p></noscript>
<script>
/* =====================================================================
   FAMILY PLAN TOOL: CONTENT (the part to edit)
   =====================================================================
   Everything the tool shows comes from this block: the opening page,

   HOW TO EDIT (plain-English notes)
   - Change words inside quotation marks "..." or back-ticks `...` freely.
   - NEVER change an "id" once answers have been saved: saved answers are
     matched by id. Ids use lower-case letters, numbers and underscores.
   - In any text, **words** shows in bold and *words* in italics.
   - Each section has:
       id, group, title
       about      "About this section": a list of paragraphs.
       guidance   the general guidance text (from guidance v2). A line
                  starting "- " is a bullet (indent two more spaces for a
                  bullet inside a bullet); lines starting "|" are a table.
       think      (optional) "Things to think about" for the section as a
                  whole, shown at the top of "Your plan".
       tables     (optional) tables to fill in. Each has an id, title,
                  intro, labelHead (heading of the first column), rows

                  columns (each with an id, head and type: "text",

                  column to sort by) and todo (which rows go on the

                  shows; 1 makes a one-line box).
       resources  the "What you have" table rows: id and label. An entry
                  with only "heading" starts a group of rows.
       keep, check, often

   - Keep the commas between items and the quotation marks in pairs. If
     the tool shows a blank page after an edit, a missing comma or

      guidance: `
- Homes get cold quickly when the heating stops.
- Have **warm clothing** (wool layers, thick socks, hats, gloves, scarves), **blankets, duvets, sleeping bags and sleeping mats**. These are core items.
- **Gather in one warm room.** Close its doors, hang blankets over the windows, and put rugs on the floor.
- **Using a portable gas heater.** Fire services advise using only heaters designed for indoor use. If a portable camping-type gas heater is the only heat available in a long, freezing outage, keep the risk as low as possible:
  - use it in **short bursts** to top up the warm room, not continuously;
  - stand it on a **fireproof mat**, at least **1 metre** from furniture, curtains, people and dogs;
  - keep a **window partly open** and a **carbon monoxide alarm** in the room;
  - **never leave it unattended**, never move it while it's lit, and **switch it off before sleeping**;
  - check the seal and fitting each time, and don't use a damaged unit;
  - change cartridges outdoors.
- **Gas cartridges in the cold.** Butane works poorly below freezing. Keep spare cartridges cool and dry, below 50 °C, but above 0 °C; in freezing weather, store them in the warm room, away from the heater.
- **Carbon monoxide** has no smell. Headache, dizziness, nausea, confusion and tiredness are warning signs. If you suspect it, or the alarm sounds: switch the appliance off, get into fresh air, and call 999 if anyone feels unwell.
- If the home becomes too cold, go and stay with family or friends.
`,

      about: [
        "A chemical leak, a large industrial fire or a nuclear incident is unlikely for most households, but if one happens you may be told to go indoors and stay there, sometimes for a day or two.",

      guidance: `
**Go in, stay in, tune in.** Leave only if you're told to. The exception is a chemical release close to you outdoors, when you should move away from it, upwind if you can.

**If you were outside when it happened:**
- Go into the nearest solid building, even if it isn't your home.
- Take off your outer clothing carefully, without pulling it over your head. Cut it off if you need to. This removes most of any contamination.
- Put the clothes and shoes in a bag and leave it outside or in a separate room.
- Don't eat, drink or smoke until you have washed.
- **Chemical:** blot or brush the substance off the skin, then rinse with plenty of water if the skin itches or hurts.
- **Radiation:** shower with soap and shampoo (no conditioner), then put on clean clothes that were stored indoors.
- Wash any pet that was outside (wear gloves) and keep it indoors.

**Sealing the house:**
- Close all doors and windows, including trickle vents.
- Switch off fans, extractor fans, air conditioning, and any heating or ventilation that draws in outside air.
- Bring pets in only if they're with you. Don't go out to look for one.

**Which room to use:**
- UK guidance says go to the **middle of the building, away from outside doors, windows and walls**.
- **If every room has windows:** choose the room with the **fewest and smallest windows**, on the side of the house away from the incident, and keep away from the glass.
- **Chemical:** an upstairs room is better, because many chemicals are heavier than air.
- **Radiation:** a central room on a lower floor is better.

**While sheltering:**
- Tune in to local radio, TV or official websites, and stay in until you're told it's safe. That's usually **1–2 days** for radiation, or a number of hours for a chemical release.
- Food and drink already indoors, covered food and **mains tap water are safe** unless you're told otherwise. Don't eat garden produce or drink water stored outside or from wells until advised.
- Don't go out to collect children from school; schools will look after them.
- Use phones only when needed, to keep lines free. Call **999** in a real emergency.
- If you need medicines, call **NHS 111** rather than going out.

**Iodine tablets**
- Stable iodine (potassium iodate) **protects only the thyroid gland, and only against radioactive iodine**. It does nothing against other radiation.
- **Take it only when officially told to, and only the tablets provided.** Never use iodised salt or other products.
- Tablets are issued in advance only to homes very close to a nuclear site. Further out, they're handed out in an emergency if needed.
- **Timing matters:**
  - one dose protects for 24 hours;
  - it works best taken up to 24 hours before, or within 2 hours after, exposure;
  - it still helps up to 8 hours after;
  - don't start it more than 24 hours after exposure.
- Adults and children over 12 usually take 2 tablets (85 mg tablets). **Follow the leaflet with the tablets you are given.**
- People with an iodine allergy, or certain rare skin and blood vessel conditions, should not take it.
- There is no official UK advice to buy your own. The plan is to follow official instructions.
`,

  - lock the car and leave a note in it with your phone number.

- **Bags:**
  - use a **rucksack**, so both hands are free for the dogs' leads;
  - a hip belt takes the weight off your shoulders;
  - line it with a bin bag and keep important items in dry bags, because rucksacks are not waterproof;
  - leave behind bags that need carrying by hand.

  - **OS Explorer map (1:25,000) and a compass**: navigation without signal or battery;
  - phone and power bank;
  - head torch and spare batteries;

  - whistle;

            if (!l.trim()) {

              if (j < lines.length && indentOf(lines[j]) >= 2) { itemLines.push(""); i++; continue; }
              break;

            if (indentOf(l) >= 2) { itemLines.push(l.slice(2)); i++; continue; }

  function isPlainObject(x) { return !!x && typeof x === "object" && !Array.isArray(x); }
  function cleanString(x) { return typeof x === "string" ? x : (typeof x === "number" ? String(x) : ""); }
  function cleanStatus(x) { return STATUS_VALUES.indexOf(x) >= 0 ? x : ""; }
  function cleanCell(col, x) {
    var v = cleanString(x);
    if (col.type === "status") return cleanStatus(v);
    if (col.type === "select") return col.options.indexOf(v) >= 0 ? v : "";
    if (col.type === "number") return /^\s*-?\d*([.,]\d+)?\s*$/.test(v) ? v.trim() : "";
    return v;
  }

  /* Version 2 section record -> clean section record */
  function cleanSectionV2(s, v) {
    var d = emptySection();
    if (isPlainObject(v.answers)) questionsOf(s).forEach(function (q) { var a = cleanString(v.answers[q.id]); if (a) d.answers[q.id] = a; });
    if (isPlainObject(v.res)) resourcesOf(s).forEach(function (r) { var st = cleanStatus(v.res[r.id]); if (st) d.res[r.id] = st; });
    if (Array.isArray(v.own)) d.own = v.own.filter(function (x) { return isPlainObject(x) && typeof x.label === "string" && x.label.trim(); })
      .map(function (x) { return { id: typeof x.id === "string" && x.id ? x.id : newId("own"), label: x.label.trim(), status: cleanStatus(x.status) }; });
    ["notes", "stored", "checkHow", "checkOften"].forEach(function (k) { d[k] = cleanString(v[k]); });
    d.done = v.done === true;
    d.notRelevant = v.notRelevant === true;
    if (d.done && d.notRelevant) d.done = false;
    if (isPlainObject(v.tables)) tablesOf(s).forEach(function (t) {
      var src = v.tables[t.id];
      if (!isPlainObject(src)) return;
      var ts = emptyTable();
      if (Array.isArray(src.own)) ts.own = src.own.filter(function (x) { return isPlainObject(x) && typeof x.id === "string" && x.id && typeof x.label === "string"; })
        .map(function (x) { return { id: x.id, label: x.label }; });
      var known = (t.rows || []).map(function (r) { return r.id; }).concat(ts.own.map(function (o) { return o.id; }));
      if (Array.isArray(src.removed)) ts.removed = src.removed.filter(function (x) { return (t.rows || []).some(function (r) { return r.id === x; }); });
      if (Array.isArray(src.order)) ts.order = src.order.filter(function (x) { return known.indexOf(x) >= 0; });
      if (isPlainObject(src.cells)) known.forEach(function (rid) {
        var row = src.cells[rid];
        if (!isPlainObject(row)) return;
        t.columns.forEach(function (c) {
          if (c.type === "calc") return;
          var val = cleanCell(c, row[c.id]);
          if (!isBlank(val)) { if (!ts.cells[rid]) ts.cells[rid] = {}; ts.cells[rid][c.id] = val; }
        });
      });
      d.tables[t.id] = ts;
    });
    return d;
  }

  /* Version 1 section record -> version 2 (keeps what maps; ignores the rest) */
  function migrateSectionV1(s, v) {
    var d = emptySection(), extraNotes = [];
    if (isPlainObject(v.plan)) questionsOf(s).forEach(function (q) { var a = cleanString(v.plan[q.id]); if (!isBlank(a)) d.answers[q.id] = a; });
    var have = isPlainObject(v.have) ? v.have : {};
    function v1(id) { return isPlainObject(have[id]) ? have[id] : null; }
    resourcesOf(s).forEach(function (r) {
      var a = v1(r.fromV1 || r.id);
      if (!a) return;
      var st = cleanStatus(a.status);
      if (st) d.res[r.id] = st;
      if (!isBlank(a.note)) extraNotes.push(r.label + ": " + cleanString(a.note).trim());
    });
    tablesOf(s).forEach(function (t) {
      var col = t.todo && t.todo.col ? t.columns.filter(function (c) { return c.id === t.todo.col; })[0] : null;
      (t.rows || []).forEach(function (row) {
        if (!row.fromV1) return;
        var a = v1(row.fromV1);
        if (!a) return;
        var st = cleanStatus(a.status);
        if (st && col) { var ts = tstate(d, t.id); ts.cells[row.id] = ts.cells[row.id] || {}; ts.cells[row.id][col.id] = st; }
        if (!isBlank(a.note)) extraNotes.push(row.label + ": " + cleanString(a.note).trim());
      });
    });
    if (Array.isArray(v.custom)) v.custom.forEach(function (x) {
      if (!isPlainObject(x) || typeof x.label !== "string" || !x.label.trim()) return;
      d.own.push({ id: typeof x.id === "string" && x.id ? x.id : newId("own"), label: x.label.trim(), status: cleanStatus(x.status) });
      if (!isBlank(x.note)) extraNotes.push(x.label.trim() + ": " + cleanString(x.note).trim());

    if (extraNotes.length) notes = (notes ? notes + "\n\n" : "") + extraNotes.join("\n");
    d.notes = notes;
    d.stored = cleanString(v.stored);
    d.checkHow = cleanString(v.checkHow);
    d.checkOften = cleanString(v.checkOften);
    d.notRelevant = v.notRelevant === true;
    return d;
  }

  /* Checks a parsed file. Returns {ok, data, savedOn, skipped, migrated} or {ok:false, message}. */
  function validateBackup(obj) {
    var notOurs = "This file is not a Family plan tool file, so it could not be opened. Please choose a file with a name like “family-plan-23-11-2026.json”.";
    var damaged = "This file seems to be damaged, so it could not be opened. Try another saved copy.";
    if (!isPlainObject(obj)) return { ok: false, message: notOurs };
    if (obj.format === "HomeEmergencyPlanner") return { ok: false, message: "This is a backup from the older Household Emergency Planner. That planner is separate, so its backups cannot be opened here. Please choose a file with a name like “family-plan-23-11-2026.json”." };
    if (obj.format !== FORMAT) return { ok: false, message: notOurs };
    if (typeof obj.formatVersion !== "number" || obj.formatVersion < 1) return { ok: false, message: damaged };
    if (obj.formatVersion > FORMAT_VERSION) return { ok: false, message: "This file was made by a newer version of the Family plan tool, so this version cannot open it." };
    if (obj.sections !== undefined && !isPlainObject(obj.sections)) return { ok: false, message: damaged };

    var out = emptyState(), skipped = 0, migrated = obj.formatVersion < 2;
    var src = isPlainObject(obj.sections) ? obj.sections : {};
    Object.keys(src).forEach(function (sid) {
      var s = sectionById(sid), v = src[sid];
      if (!s || !isPlainObject(v)) { skipped++; return; }
      out.sections[sid] = migrated ? migrateSectionV1(s, v) : cleanSectionV2(s, v);
    });
    if (!migrated && isPlainObject(obj.ui) && isPlainObject(obj.ui.guideOpen)) {
      Object.keys(obj.ui.guideOpen).forEach(function (k) { if (sectionById(k) && typeof obj.ui.guideOpen[k] === "boolean") out.ui.guideOpen[k] = obj.ui.guideOpen[k]; });
    }
    return { ok: true, data: out, savedOn: typeof obj.savedOn === "string" ? obj.savedOn : "", skipped: skipped, migrated: migrated };
  }

  function openFile(file) {
    if (!file) return;
    if (file.size > MAX_FILE_BYTES) {
      notice("That file is too large to be a Family plan tool file. Please choose a file with a name like “family-plan-23-11-2026.json”.", "error");
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () { notice("Sorry, that file could not be read. Please try again.", "error"); };
    reader.onload = function () {
      var text = String(reader.result).replace(/^﻿/, "");
      if (text.slice(0, 2) === "PK") {
        notice("This looks like a downloaded plan or to-do list (.odt), which opens in LibreOffice Writer. To carry on with the tool, choose the saved file ending in .json, with a name like “family-plan-23-11-2026.json”.", "error");
        return;
      }
      var parsed;
      try { parsed = JSON.parse(text); }
      catch (e) { notice("This file is not a Family plan tool file, so it could not be opened. Please choose a file with a name like “family-plan-23-11-2026.json”.", "error"); return; }
      var result = validateBackup(parsed);
      if (!result.ok) { notice(result.message, "error"); return; }
      var confirmFirst = hasAnyAnswers()
        ? ask({
            title: "Replace what is in the tool now?",
            message: [
              "Opening “" + file.name + "” will replace all the answers currently in the tool.",
              "If you want to keep the current answers, press Cancel and use “Save to file” first."
            ],
            okText: "Yes, open the file", cancelText: "Cancel"
          })
        : Promise.resolve(true);
      confirmFirst.then(function (yes) {
        if (!yes) return;
        state = result.data;
        saveNow().then(function () {
          go("about", { noSave: true });
          updateProgress();
          notice("Opened “" + file.name + "”" + (result.savedOn ? " (saved on " + result.savedOn + ")" : "") + ". Your answers have been restored." +
            (result.migrated ? " The file was made by version 1 of the tool: answers that match this version have been carried over, and notes on individual items have been moved into each section's notes box." : "") +
            (result.skipped ? " A small part of the file was not recognised and was left out." : ""), "ok");
        });
      });
    };
    reader.readAsText(file);
  }

  function startAgain() {
    ask({
      title: "Start again?",
      message: [
        "This will delete all the answers in the Family plan tool on this computer, including any rows you added.",
        "We recommend pressing Cancel and using “Save to file” first, so there is a copy.",
        "Files already saved, and everything else on this computer, are not affected."
      ],
      okText: "Delete the answers and start again", cancelText: "Cancel", danger: true
    }).then(function (yes) {
      if (!yes) return;
      clearTimeout(saveTimer); saveTimer = null;
      storage.clear().then(function () {
        state = emptyState();
        showSavedTime();
        updateProgress();
        go("about", { noSave: true });
        notice("All answers have been cleared. You can start again.", "ok");
      });
    });
  }

  function guessWidths(head, rows, total) {
    var n = head.length;
    var lens = head.map(function (h, i) {
      var m = plainText(h).length;

  /* Guidance blocks -> ODF. Tables are not allowed inside ODF lists, so a list

  function guidanceToOdf(doc, blocks) {
    function itemXml(blocks, level, tables) {
      var x = "";
      blocks.forEach(function (b, idx) {
        if (b.type === "p" || b.type === "sub") x += P("List_20_Contents", odfInline(b.type === "sub" ? "**" + b.text + "**" : b.text));

      '<style:default-style style:family="table"><style:table-properties table:border-model="collapsing"/></style:default-style>' +
      '<style:style style:name="Standard" style:family="paragraph" style:class="text"/>' +
      para("Text_20_body", "Text body", "Standard", 'fo:margin-top="0cm" fo:margin-bottom="0.2cm" fo:line-height="120%"', null, ' style:class="text"') +
      para("Heading", "Heading", "Standard", 'fo:margin-top="0.4cm" fo:margin-bottom="0.2cm" fo:keep-with-next="always"', 'style:font-name="Liberation Sans"', ' style:next-style-name="Text_20_body" style:class="text"') +
      heading(1, "20pt", "#3e4a30", "0.2cm") + heading(2, "16pt", "#4d593c", "0.6cm") + heading(3, "13pt", "#2e3322", "0.4cm") +
      para("Title", "Title", "Heading", 'fo:text-align="start" fo:margin-bottom="0.2cm"', 'fo:font-size="28pt" fo:font-weight="bold" fo:color="#3e4a30"', ' style:class="chapter"') +
      para("Subtitle", "Subtitle", "Heading", 'fo:margin-top="0cm" fo:margin-bottom="0.5cm"', 'fo:font-size="13pt" fo:color="#444444"', ' style:class="chapter"') +
      para("Subheading", "Guidance subheading", "Text_20_body", 'fo:margin-top="0.25cm" fo:keep-with-next="always"', 'fo:font-weight="bold"') +
      para("Label", "Answer label", "Text_20_body", 'fo:margin-top="0.25cm" fo:margin-bottom="0.05cm" fo:keep-with-next="always"', 'fo:font-weight="bold" fo:color="#3e4a30"') +
      para("Lead", "Lead paragraph", "Text_20_body", null, 'fo:font-size="12.5pt"') +
      para("Numbered", "Numbered paragraph", "Text_20_body", 'fo:margin-left="0.7cm" fo:text-indent="-0.6cm"', null) +
      para("Answer", "Answer", "Text_20_body", 'fo:margin-left="0.5cm" fo:margin-bottom="0.2cm"', null) +
      para("Group_20_Intro", "Part introduction", "Text_20_body", null, 'fo:font-style="italic" fo:font-size="12pt"') +
      para("Empty", "Empty note", "Text_20_body", null, 'fo:font-style="italic" fo:color="#555555"') +
      para("List_20_Contents", "List Contents", "Standard", 'fo:margin-top="0cm" fo:margin-bottom="0.1cm" fo:line-height="115%"', null) +
      para("Table_20_Contents", "Table Contents", "Standard", 'fo:margin-top="0cm" fo:margin-bottom="0cm"', 'fo:font-size="10.5pt"', ' style:class="extra"') +
      para("Table_20_Heading", "Table Heading", "Table_20_Contents", null, 'fo:font-weight="bold"', ' style:class="extra"') +
      para("Footer", "Footer", "Standard", 'fo:text-align="center"', 'fo:font-size="9pt" fo:color="#444444"', ' style:class="extra"') +
      '<style:style style:name="Strong_20_Emphasis" style:display-name="Strong Emphasis" style:family="text"><style:text-properties fo:font-weight="bold"/></style:style>' +
      '<style:style style:name="Emphasis" style:family="text"><style:text-properties fo:font-style="italic"/></style:style>' +
      outline +
      '<text:list-style style:name="L1" style:display-name="Guidance bullets">' + bulletLevel(1, "•", 0.7) + bulletLevel(2, "–", 1.4) + bulletLevel(3, "◦", 2.1) + "</text:list-style>" +
      "</office:styles>" +
      '<office:automatic-styles><style:page-layout style:name="pm1"><style:page-layout-properties fo:page-width="21cm" fo:page-height="29.7cm" style:print-orientation="portrait" fo:margin-top="1.8cm" fo:margin-bottom="1.2cm" fo:margin-left="2cm" fo:margin-right="2cm"/>' +
      '<style:footer-style><style:header-footer-properties fo:min-height="0cm" fo:margin-top="0.4cm"/></style:footer-style></style:page-layout></office:automatic-styles>' +
      '<office:master-styles><style:master-page style:name="Standard" style:page-layout-name="pm1"><style:footer>' +
      P("Footer", xmlEsc(footerText) + ' · page <text:page-number text:select-page="current">1</text:page-number>') +
      "</style:footer></style:master-page></office:master-styles></office:document-styles>";
  }

  function metaXml(title, now) {
    var iso = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    return '<?xml version="1.0" encoding="UTF-8"?>\n<office:document-meta ' + NS + ' office:version="1.3"><office:meta>' +
      "<meta:generator>" + APP_NAME + " 2</meta:generator><dc:title>" + xmlEsc(title) + "</dc:title><dc:language>en-GB</dc:language>" +
      "<meta:creation-date>" + iso + "</meta:creation-date><dc:date>" + iso + "</dc:date></office:meta></office:document-meta>";
  }

  var MANIFEST = '<?xml version="1.0" encoding="UTF-8"?>\n<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.3">' +
    '<manifest:file-entry manifest:full-path="/" manifest:version="1.3" manifest:media-type="application/vnd.oasis.opendocument.text"/>' +
    '<manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/>' +
    '<manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/>' +
    '<manifest:file-entry manifest:full-path="meta.xml" manifest:media-type="text/xml"/>' +
    "</manifest:manifest>";

  /* ---- minimal ZIP writer (STORE method, CRC-32) ---- */
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  /* files: [{name, data: string}] in order. Returns Uint8Array. */
  function makeZip(files, when) {
    var enc = new TextEncoder();
    var dosTime = (when.getHours() << 11) | (when.getMinutes() << 5) | Math.floor(when.getSeconds() / 2);
    var dosDate = ((when.getFullYear() - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate();
    var locals = [], centrals = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 10, true); h.setUint16(6, 0, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      locals.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 10, true); c.setUint16(8, 0, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
      c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true);
      c.setUint32(42, offset, true);
      centrals.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    });
    var cdSize = centrals.reduce(function (a, b) { return a + b.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
    e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true); e.setUint16(20, 0, true);
    var parts = locals.concat(centrals, [new Uint8Array(e.buffer)]);
    var total = parts.reduce(function (a, b) { return a + b.length; }, 0);
    var out = new Uint8Array(total), pos = 0;
    parts.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  function makeOdt(doc, title, footer, now) {
    return makeZip([
      { name: "mimetype", data: "application/vnd.oasis.opendocument.text" },
      { name: "META-INF/manifest.xml", data: MANIFEST },
      { name: "content.xml", data: contentXml(doc) },
      { name: "styles.xml", data: stylesXml(footer) },
      { name: "meta.xml", data: metaXml(title, now) }
    ], now);
  }

  /* ---- 1. Family plan ---- */
  function relevantGroups() {
    return GROUPS.map(function (g) {
      return { group: g, sections: sectionsIn(g).filter(function (s) { var d = peek(s.id); return !(d && d.notRelevant); }) };
    }).filter(function (x) { return x.sections.length; });
  }
  function boldX(t) { return '<text:span text:style-name="Strong_20_Emphasis">' + xmlEsc(t) + "</text:span>"; }
  function bulletsX(doc, items) {
    doc.add('<text:list text:style-name="L1">' + items.map(function (t) { return "<text:list-item>" + P("List_20_Contents", odfInline(t)) + "</text:list-item>"; }).join("") + "</text:list>");
  }
  function aboutPartToOdf(doc, p) {
    doc.add(H(2, xmlEsc(p.heading)));
    (p.paras || []).forEach(function (t) { doc.add(P("Text_20_body", odfInline(t))); });
    if (p.bullets) bulletsX(doc, p.bullets);
    if (p.numbered) p.numbered.forEach(function (t, i) { doc.add(P("Numbered", (i + 1) + ".<text:tab/>" + odfInline(t))); });
  }

  function buildPlanOdt(now) {
    now = now || new Date();
    var doc = new OdfDoc();
    doc.add(P("Title", "Family plan"));
    doc.add(P("Subtitle", "Generated on " + xmlEsc(formatDateTime(now))));
    doc.add(H(1, xmlEsc(ABOUT.title)));
    doc.add(P("Lead", odfInline(ABOUT.lead || "")));
    (ABOUT.parts || []).forEach(function (p) { aboutPartToOdf(doc, p); });
    if (ABOUT.scenarios && ABOUT.scenarios.length) {
      doc.add(H(2, xmlEsc(ABOUT.scenariosHeading || "The three scenarios")));
      doc.add(P("Text_20_body", odfInline(ABOUT.scenariosIntro || "")));
      ABOUT.scenarios.forEach(function (sc) {
        doc.add(H(3, xmlEsc("Scenario " + sc.code + ": " + sc.title)));
        [["For example", sc.examples], ["Time you have", sc.time], ["Stay or go", sc.stay], ["What you can take", sc.take], ["Sections to use", sc.sections]].forEach(function (r) {
          doc.add(P("Text_20_body", boldX(r[0] + ": ") + xmlEsc(r[1])));
        });
      });
    }
    (ABOUT.after || []).forEach(function (p) { aboutPartToOdf(doc, p); });

    var groups = relevantGroups();
    doc.add(H(2, "What this plan covers"));
    if (!groups.length) doc.add(P("Empty", "Every section has been marked as not relevant, so there is nothing more to show."));
    else {
      doc.add('<text:list text:style-name="L1">');
      groups.forEach(function (x) {
        doc.add("<text:list-item>" + P("List_20_Contents", boldX(x.group.title)) +
          (isSolo(x.group) ? "" : "<text:list>" + x.sections.map(function (s) {
            var d = peek(s.id);
            return "<text:list-item>" + P("List_20_Contents", xmlEsc(s.title + (d && d.done ? " (done for now)" : ""))) + "</text:list-item>";
          }).join("") + "</text:list>") + "</text:list-item>");
      });
      doc.add("</text:list>");
      var nr = SECTIONS.filter(function (s) { var d = peek(s.id); return d && d.notRelevant; });
      if (nr.length) doc.add(P("Text_20_body", boldX("Marked as not relevant to this household: ") + xmlEsc(nr.map(function (s) { return s.title; }).join(", ") + ".")));
    }

    groups.forEach(function (x) {
      var g = x.group, solo = isSolo(g);
      doc.add(H(1, xmlEsc(g.title), "H1break"));
      if (g.subtitle) doc.add(P("Group_20_Intro", xmlEsc(g.subtitle)));
      x.sections.forEach(function (s) {
        var lv = solo ? 2 : 3;
        if (!solo) doc.add(H(2, xmlEsc(s.title)));
        doc.add(H(lv, "About this section"));
        (s.about || []).forEach(function (t) { doc.add(P("Text_20_body", odfInline(t))); });
        doc.add(H(lv, "General guidance"));
        guidanceToOdf(doc, guidanceOf(s));
        doc.add(H(lv, "Household response"));
        responseToOdf(doc, s);
      });
    });
    return makeOdt(doc, "Family plan", "Family plan, generated on " + formatDate(now), now);
  }

  function qa(doc, label, answer) {
    if (isBlank(answer)) return false;
    doc.add(P("Label", xmlEsc(label)));
    doc.add(P("Answer", odfText(String(answer).trim())));
    return true;
  }

  function dataTableToOdf(doc, t, ts) {
    var rows = tableRows(t, ts).filter(function (r) { return rowHasData(t, ts, r.id); });
    if (!rows.length) return false;
    if (t.sortCol) rows = rowsSortedBy(rows, ts.cells, t.sortCol);
    doc.add(P("Label", xmlEsc(t.title + (t.sortCol ? " (sorted by " + t.columns.filter(function (c) { return c.id === t.sortCol; })[0].head.toLowerCase() + ")" : ""))));
    var head = [t.labelHead || "Item"].concat(t.columns.map(function (c) { return c.head; }));
    var body = rows.map(function (r) {
      return [r.label].concat(t.columns.map(function (c) { return colDisplay(c, ts, r.id); }));
    });
    var widths = guessWidths(head, body, 17);
    doc.table(widths, head.map(xmlEsc), rows.map(function (r, i) {
      return {
        cells: body[i].map(function (v, j) { return j === 0 ? xmlEsc(v) : odfText(v); }),
        cellStyles: [ "CellBody" ].concat(t.columns.map(function (c) { return c.type === "status" ? statusCellStyle(cellVal(ts, r.id, c.id)) : "CellBody"; }))
      };
    }));
    return true;
  }

  function responseToOdf(doc, s) {
    var d = peek(s.id) || emptySection();
    var any = false;
    tablesOf(s).forEach(function (t) { if (dataTableToOdf(doc, t, d.tables[t.id])) any = true; });
    questionsOf(s).forEach(function (q) { if (qa(doc, q.label, d.answers[q.id])) any = true; });

    var rows = [], unanswered = 0;
    resourcesOf(s).forEach(function (r) {
      var st = d.res[r.id];
      if (!st) { unanswered++; return; }
      rows.push({ cells: [xmlEsc(r.label), xmlEsc(statusLabel(st))], cellStyles: ["CellBody", statusCellStyle(st)] });
    });
    d.own.forEach(function (o) {
      if (!o.status) { unanswered++; return; }
      rows.push({ cells: [xmlEsc(o.label) + ' <text:span text:style-name="Emphasis">(your own item)</text:span>', xmlEsc(statusLabel(o.status))], cellStyles: ["CellBody", statusCellStyle(o.status)] });
    });
    if (rows.length) {
      any = true;
      doc.add(P("Label", "What you have"));
      doc.table([13, 4], ["Item or action", "Status"], rows);
      if (unanswered) doc.add(P("Empty", unanswered + (unanswered === 1 ? " item has" : " items have") + " not been answered yet. See the to-do list."));
    }
    if (qa(doc, NOTES_LABEL, d.notes)) any = true;
    if (qa(doc, keepLabel(s), d.stored)) any = true;
    if (qa(doc, checkLabel(s), d.checkHow)) any = true;
    if (qa(doc, OFTEN_LABEL, d.checkOften)) any = true;
    if (!any) doc.add(P("Empty", "This section has not been filled in yet."));
  }

  /* ---- 2. To-do list ---- */
  function buildTodoOdt(now) {
    now = now || new Date();
    var doc = new OdfDoc();
    var t = todoCounts();
    doc.add(P("Title", "To-do list"));
    doc.add(P("Subtitle", "Generated on " + xmlEsc(formatDateTime(now))));
    doc.add(P("Text_20_body", "Every item in the “What you have” tables of the relevant sections, plus rows in the other tables (such as the risk register and information sources) that still need doing. Work through the list, update the tool, then download a fresh list."));
    doc.add(H(1, "Colour key and counts"));
    doc.table([3, 5, 2.5], ["Colour", "Status", "Items"], [
      { cells: ["Green", "Yes", String(t.yes)], cellStyle: statusCellStyle("yes") },
      { cells: ["Amber", "In progress", String(t.progress)], cellStyle: statusCellStyle("progress") },
      { cells: ["Red", "No", String(t.no)], cellStyle: statusCellStyle("no") },
      { cells: ["Red", "Not sure (or not yet assessed)", String(t.unsure)], cellStyle: statusCellStyle("unsure") },
      { cells: ["White", "Not answered yet", String(t.none)], cellStyle: statusCellStyle("none") },
      { cells: ["", boldX("Total"), boldX(String(t.total))] }
    ]);
    if (!t.total) doc.add(P("Empty", "There are no items: every section has been marked as not relevant."));
    relevantGroups().forEach(function (x) {
      var started = false;
      x.sections.forEach(function (s) {
        var items = todoFor(s), d = peek(s.id) || emptySection();
        if (!items.length && isBlank(d.notes)) return;
        if (!started) { doc.add(H(1, xmlEsc(x.group.title))); started = true; }
        if (!isSolo(x.group)) doc.add(H(2, xmlEsc(s.title)));
        if (items.length) {
          doc.table([13, 4], ["Item", "Status"], items.map(function (it) {
            return {
              cells: [xmlEsc(it.label) + (it.own ? ' <text:span text:style-name="Emphasis">(your own item)</text:span>' : ""),
                boldX(it.text || (it.status ? statusLabel(it.status) : "Not answered"))],
              cellStyles: ["CellBody", statusCellStyle(it.status)]
            };
          }));
        }
        if (!isBlank(d.notes)) { doc.add(P("Label", "Notes")); doc.add(P("Answer", odfText(d.notes.trim()))); }
      });
    });
    return makeOdt(doc, "To-do list", "To-do list, generated on " + formatDate(now), now);
  }

  var ODT_TYPE = "application/vnd.oasis.opendocument.text";
  function downloadPlan() {
    if (saveTimer) saveNow();
    var now = new Date(), name = "family-plan-" + fileDate(now) + ".odt";
    downloadBlob(new Blob([buildPlanOdt(now)], { type: ODT_TYPE }), name);
    notice("Your family plan has been saved as “" + name + "” in the Downloads folder. Double-click it to open it in LibreOffice Writer.", "ok");
  }
  function downloadTodo() {
    if (saveTimer) saveNow();
    var now = new Date(), name = "family-plan-to-do-" + fileDate(now) + ".odt";
    downloadBlob(new Blob([buildTodoOdt(now)], { type: ODT_TYPE }), name);
    notice("Your to-do list has been saved as “" + name + "” in the Downloads folder. Double-click it to open it in LibreOffice Writer.", "ok");
  }

  /* ------------------------------------------------------------------ */
  /* Start-up                                                           */
  /* ------------------------------------------------------------------ */

  function loadInto(saved) {
    if (!saved) return;
    var r = validateBackup(saved);
    if (!r.ok) return;
    state = r.data;
    state.savedAt = typeof saved.savedAt === "string" ? saved.savedAt : null;
    if (typeof saved.lastView === "string" && VIEWS.indexOf(saved.lastView) >= 0) currentView = saved.lastView;
    if (r.migrated) changed(true); // re-save in the version 2 format
  }

  function init() {
    if (!SECTIONS.length) {
      $("view").appendChild(el("p", { className: "notice notice-error", text: "The sections could not be loaded. If the content block was edited recently, check it for a missing comma or quotation mark." }));
      return;
    }
    $("btn-save-file").addEventListener("click", saveToFile);
    $("btn-open").addEventListener("click", function () { $("file-input").click(); });
    $("btn-downloads").addEventListener("click", function () { go("downloads"); });
    $("btn-reset").addEventListener("click", startAgain);
    $("btn-prev").addEventListener("click", function () { step(-1); });
    $("btn-next").addEventListener("click", function () { step(1); });
    $("file-input").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      openFile(f);
    });
    buildSelect();
    storage.init().then(function () { return storage.load(); }).then(function (saved) {
      loadInto(saved);
      showSavedTime();
      updateProgress();
      if (storage.backend === "none") setSaveStatus("This browser cannot keep answers here. Use “Save to file” often.", true);
      go(currentView, { noFocus: true, noSave: true });
      window.FamilyPlanTool.ready = true;
    });
  }

  // A little access for testing and troubleshooting.
  window.FamilyPlanTool = {
    ready: false,
    version: FORMAT_VERSION,
    storageBackend: function () { return storage.backend; },
    flushSave: function () { return saveNow(); },
    buildPlanOdt: buildPlanOdt,
    buildTodoOdt: buildTodoOdt,
    getState: function () { return clone(state); }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
