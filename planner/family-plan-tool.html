<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family plan tool</title>
<!--
  Family plan tool, version 1.
  One self-contained file: no libraries, no internet, nothing is sent anywhere.
  Answers are kept in this browser (IndexedDB "FamilyPlanTool", with the
  localStorage key "FamilyPlanTool.v1" as a fallback) and in files you save.
  To change the sections or questions, edit the CONTENT block near the top
  of the <script> section below.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f6f3ec;
  --panel: #ffffff;
  --text: #1a1a1a;
  --muted: #444444;
  --line: #8a8a8a;
  --soft-line: #d6d0c4;
  --primary: #0b4f8a;
  --primary-dark: #083a66;
  --primary-tint: #e3eef8;
  --ok: #1d6b2f;
  --ok-tint: #e5f3e8;
  --amber: #8a5a00;
  --amber-tint: #fff1cc;
  --danger: #9e1b1b;
  --danger-tint: #fbe9e9;
  --guide-bg: #fbf8f1;
  --focus: #ffbf47;
  --radius: 8px;
  font-size: 19px;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", Ubuntu, Cantarell, "Noto Sans", "DejaVu Sans", Arial, sans-serif;
  font-size: 1rem; line-height: 1.5;
}
h1, h2, h3, h4 { line-height: 1.25; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--text); }
.skip-link { position: absolute; left: -9999px; top: 0; background: var(--focus); color: var(--text); padding: 0.5rem 1rem; z-index: 100; }
.skip-link:focus { left: 1rem; top: 1rem; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.topbar {
  background: var(--primary-dark); color: #fff; padding: 0.6rem 1.25rem;
  display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.app-title { font-size: 1.3rem; margin: 0; }
.save-status { margin: 0.1rem 0 0; font-size: 0.9rem; color: #e8f0f8; }
.save-status.is-error { color: #fff; background: var(--danger); padding: 0.1rem 0.5rem; border-radius: 4px; }
.topbar-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.topbar .btn { background: #fff; color: var(--primary-dark); border-color: #fff; }
.topbar .btn:hover { background: var(--primary-tint); }
.topbar .btn-danger-outline { color: var(--danger); }

/* buttons */
.btn {
  font: inherit; font-size: 0.95rem; font-weight: 600; min-height: 2.5rem; padding: 0.4rem 1rem;
  border: 2px solid var(--primary); border-radius: var(--radius); background: var(--panel); color: var(--primary); cursor: pointer;
}
.btn:hover { background: var(--primary-tint); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: #7a1414; }
.btn-large { font-size: 1.05rem; padding: 0.6rem 1.3rem; }
.btn-small { font-size: 0.85rem; min-height: 2rem; padding: 0.2rem 0.7rem; }
.btn-quiet { border-color: var(--line); color: var(--text); }
.btn-quiet:hover { background: #eee; }

/* layout */
.layout { display: grid; grid-template-columns: 19rem minmax(0, 1fr); gap: 1.25rem; max-width: 84rem; margin: 0 auto; padding: 1.1rem; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; padding: 0.75rem; } .topbar { position: static; } }
.sidebar { background: var(--panel); border: 1px solid var(--soft-line); border-radius: var(--radius); padding: 0.9rem; align-self: start; }
@media (min-width: 901px) { .sidebar { position: sticky; top: 5.6rem; max-height: calc(100vh - 6.4rem); overflow-y: auto; } }

.progress-text { margin: 0 0 0.35rem; font-weight: 700; font-size: 0.95rem; }
.progress-bar { display: flex; height: 0.85rem; background: #e6e1d6; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.progress-fill { height: 100%; width: 0; background: var(--ok); }
.progress-part { height: 100%; width: 0; background: #e0a800; }
.progress-key { list-style: none; margin: 0.45rem 0 0; padding: 0; font-size: 0.85rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.1rem 0.5rem; }

.nav-group { margin: 0.9rem 0 0.2rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
.section-list { list-style: none; margin: 0.5rem 0 0; padding: 0; }
.section-list li { margin: 0 0 0.1rem; }
.nav-btn {
  width: 100%; text-align: left; font: inherit; font-size: 0.92rem; background: transparent; color: var(--text);
  border: 2px solid transparent; border-radius: var(--radius); padding: 0.25rem 0.5rem; cursor: pointer;
  display: flex; gap: 0.5rem; align-items: flex-start; line-height: 1.3;
}
.nav-btn:hover { background: var(--primary-tint); }
.nav-btn[aria-current="page"] { border-color: var(--primary); background: var(--primary-tint); font-weight: 700; }
.nav-btn .nav-label { flex: 1; }
.nav-special { margin-top: 0.4rem; border-color: var(--primary); font-weight: 700; color: var(--primary-dark); }

/* status badges (symbol + words, never colour alone) */
.badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; font-weight: 700; padding: 0.05rem 0.45rem; border-radius: 99px; border: 1.5px solid; white-space: nowrap; flex: none; margin-top: 0.1rem; }
.badge-notstarted { color: #444; border-color: #888; background: #fff; }
.badge-part { color: var(--amber); border-color: #c58a00; background: var(--amber-tint); }
.badge-complete { color: var(--ok); border-color: var(--ok); background: var(--ok-tint); }
.badge-notrelevant { color: #555; border-color: #aaa; background: #eee; text-decoration: none; }

.main { background: var(--panel); border: 1px solid var(--soft-line); border-radius: var(--radius); padding: 1.4rem 2rem 2rem; min-width: 0; }
.main:focus { outline: none; }
@media (max-width: 600px) { .main { padding: 1rem; } }
.main h2 { font-size: 1.6rem; margin: 0.1rem 0 0.5rem; }
.main h2:focus { outline: none; }
.crumb { margin: 0; color: var(--muted); font-size: 0.9rem; font-weight: 600; }
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 1rem; align-items: flex-start; }
.part-title { font-size: 1.25rem; margin: 2rem 0 0.4rem; padding-top: 0.75rem; border-top: 3px solid var(--primary); color: var(--primary-dark); }
.part-title .num { display: inline-block; min-width: 1.6rem; }
.lead { font-size: 1.05rem; margin: 0.25rem 0 1rem; }

.nr-box { border: 2px solid var(--line); border-radius: var(--radius); padding: 0.5rem 1rem; margin: 0.5rem 0 1rem; display: flex; align-items: center; gap: 0.75rem; background: #faf9f6; }
.nr-box input { width: 1.5rem; height: 1.5rem; margin: 0; accent-color: var(--primary); flex: none; }
.nr-box label { font-weight: 700; cursor: pointer; }
.nr-note { background: #eee; border-left: 6px solid #777; padding: 0.75rem 1rem; border-radius: 4px; }

/* notices */
.notice { border-left: 6px solid var(--primary); background: var(--primary-tint); padding: 0.75rem 1rem; margin: 0 0 1.25rem; border-radius: 4px; }
.notice-ok { border-color: var(--ok); background: var(--ok-tint); }
.notice-error { border-color: var(--danger); background: var(--danger-tint); font-weight: 600; }

/* guidance */
.guidance { background: var(--guide-bg); border: 1px solid var(--soft-line); border-radius: var(--radius); margin: 0 0 1rem; }
.guidance > summary { cursor: pointer; font-weight: 700; padding: 0.6rem 1rem; font-size: 1.05rem; }
.guidance-body { padding: 0 1.25rem 0.75rem; }
.guidance-body ul { margin: 0.25rem 0 0.6rem; padding-left: 1.4rem; }
.guidance-body li { margin: 0.15rem 0; }
.guidance-body p { margin: 0.3rem 0 0.6rem; }
.guidance-body .g-sub { font-weight: 700; margin-top: 0.8rem; }
.g-table { border-collapse: collapse; margin: 0.4rem 0 0.8rem; font-size: 0.95rem; }
.g-table th, .g-table td { border: 1px solid #888; padding: 0.3rem 0.55rem; text-align: left; vertical-align: top; }
.g-table th { background: #ece6d8; }

/* questions */
.q { margin: 0 0 1.25rem; padding: 0; border: 0; min-width: 0; }
.q-label { display: block; font-weight: 700; font-size: 1rem; margin-bottom: 0.3rem; padding: 0; }
legend.q-label { float: left; width: 100%; }
legend.q-label + * { clear: both; }
.help { color: var(--muted); margin: 0 0 0.4rem; font-size: 0.92rem; }
.help-warn { color: var(--danger); font-weight: 600; }
.field { font: inherit; width: 100%; padding: 0.45rem 0.6rem; border: 2px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); }
.field:focus { border-color: var(--primary); }
textarea.field { resize: vertical; min-height: 4.2rem; }

/* status choices */
.choices { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin: 0.15rem 0 0.35rem; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip label {
  display: inline-block; cursor: pointer; border: 2px solid var(--line); border-radius: 99px;
  padding: 0.2rem 0.85rem; font-weight: 600; font-size: 0.92rem; background: #fff; min-height: 2.1rem; line-height: 1.5;
}
.chip input:focus-visible + label { outline: 4px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--text); }
.chip label:hover { background: var(--primary-tint); }
.chip input:checked + label::before { content: "✓ "; }
.chip input:checked + label { color: #fff; border-color: var(--text); }
.chip.s-yes input:checked + label { background: var(--ok); }
.chip.s-progress input:checked + label { background: #8a5a00; }
.chip.s-no input:checked + label, .chip.s-unsure input:checked + label { background: var(--danger); }
.chip.s-plain input:checked + label { background: var(--primary); }
.clear-btn { font: inherit; font-size: 0.85rem; background: none; border: 0; color: var(--primary); text-decoration: underline; cursor: pointer; padding: 0.2rem 0.3rem; }

.have-list { list-style: none; margin: 0; padding: 0; }
.have-item { border: 2px solid var(--soft-line); border-left-width: 8px; border-radius: var(--radius); padding: 0.55rem 0.9rem 0.6rem; margin: 0 0 0.6rem; background: #fff; }
.have-item.st-yes { border-left-color: var(--ok); }
.have-item.st-progress { border-left-color: #e0a800; }
.have-item.st-no, .have-item.st-unsure { border-left-color: var(--danger); }
.have-item fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.have-item legend { font-weight: 700; padding: 0; float: left; width: 100%; margin-bottom: 0.2rem; }
.have-item legend + * { clear: both; }
.have-item .custom-tag { font-weight: 400; font-style: italic; color: var(--muted); }
.note-row { display: flex; gap: 0.5rem; align-items: center; }
.note-row label { font-size: 0.88rem; color: var(--muted); white-space: nowrap; }
.note-row .field { padding: 0.3rem 0.5rem; font-size: 0.95rem; }
.add-box { border: 2px dashed var(--line); border-radius: var(--radius); padding: 0.6rem 0.9rem; margin: 0.5rem 0 1rem; }
.add-box label { display: block; font-weight: 700; margin-bottom: 0.3rem; }
.add-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.add-controls .field { flex: 1; min-width: 14rem; }

.prev-next { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--soft-line); }

/* start and documents pages */
.panel-box { border: 2px solid var(--soft-line); border-radius: var(--radius); padding: 0.75rem 1.25rem; margin: 1rem 0; }
.panel-box h3 { margin: 0.25rem 0 0.5rem; }
.panel-box li { margin-bottom: 0.3rem; }
.panel-ok { border-color: var(--ok); background: var(--ok-tint); }
.start-actions, .doc-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
.count-table { border-collapse: collapse; margin: 0.5rem 0 1rem; }
.count-table th, .count-table td { border: 1px solid #888; padding: 0.3rem 0.8rem; text-align: left; }
.count-table td.n { text-align: right; font-weight: 700; }
.key-yes { background: #c6efce; } .key-progress { background: #ffe699; } .key-no { background: #f4b6b6; } .key-none { background: #fff; }

/* dialog */
.dialog { border: 3px solid var(--text); border-radius: var(--radius); max-width: 34rem; width: calc(100% - 2rem); padding: 1.25rem 1.5rem; color: var(--text); }
.dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
.dialog-title { margin: 0 0 0.5rem; font-size: 1.35rem; }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem; }
.noscript { padding: 2rem; font-size: 1.2rem; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to the questions</a>
<div class="app" id="app">
  <header class="topbar">
    <div>
      <h1 class="app-title">Family plan tool</h1>
      <p class="save-status" id="save-status" role="status" aria-live="polite">Not saved yet</p>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn" id="btn-save-file">Save to file</button>
      <button type="button" class="btn" id="btn-open">Open a saved file</button>
      <button type="button" class="btn btn-danger-outline" id="btn-reset">Start again</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Sections">
      <div id="progress">
        <p class="progress-text" id="progress-text">Progress</p>
        <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div><div class="progress-part" id="progress-part"></div></div>
        <ul class="progress-key" id="progress-key"></ul>
      </div>
      <div id="section-nav"></div>
    </nav>
    <main id="main" class="main" tabindex="-1">
      <div id="notice" class="notice" role="alert" hidden></div>
      <div id="view"></div>
    </main>
  </div>
</div>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
  <h2 id="dialog-title" class="dialog-title"></h2>
  <div id="dialog-message"></div>
  <div class="dialog-actions">
    <button type="button" class="btn" id="dialog-cancel">Cancel</button>
    <button type="button" class="btn btn-primary" id="dialog-ok">OK</button>
  </div>
</dialog>
<noscript><p class="noscript">This tool needs JavaScript switched on in Firefox.</p></noscript>
<script>
/* =====================================================================
   FAMILY PLAN TOOL: CONTENT (the part to edit)
   =====================================================================
   Everything the tool shows comes from this block: the sections, their
   introductions, the general guidance and the questions.

   HOW TO EDIT (plain-English notes)
   - Change words inside quotation marks "..." or back-ticks `...` freely.
   - NEVER change an "id" once answers have been saved: saved answers are
     matched to questions by their id. Every id in a section must be
     different. Ids use lower-case letters, numbers and underscores only.
   - Each section has:
       id        a unique name (never change it)
       group     which part it belongs to (see GROUPS)
       title     the heading on screen and in the plan
       intro     1 to 2 sentences explaining what the section covers
       guidance  the general guidance text (from guidance v2). It uses:
                   a line starting "- " for a bullet point (indent two
                   spaces more for a bullet inside a bullet);
                   **words** for bold and *words* for italics;
                   lines starting "|" for a table (first line = headings,
                   second line = |---|---|).
       plan      the "Our plan" questions. Each has an id and a label,
                 and optionally:
                   help  a hint shown under the question
                   type  "textarea" (several lines, the default),
                         "text" (one line) or
                         "yesno" (Yes / No / Not sure)
       have      the "Do we have ...?" items. Each has an id and a label.
                 People choose Yes / In progress / No / Not sure, and can
                 add a note. They can also add their own items.
       storedLabel, checkLabel, oftenLabel (optional)
                 replace the usual wording of the "Where it is stored",
                 "How we check it works" and "How often" questions.
   - Every section automatically gets a box for "Anything else" at the
     end of "Our plan".
   - Keep the commas between items and the quotation marks in pairs. If
     the tool shows a blank page after an edit, a missing comma or
     quotation mark is the usual cause.
   - Never put personal details in this file.
   ===================================================================== */

var FAMILY_PLAN_CONTENT = {
  contentVersion: "1",

  GROUPS: [
    { id: "ready", title: "Getting ready", subtitle: "Applies to every scenario" },
    { id: "a", title: "Scenario A: Staying at home", subtitle: "Storm, long power cut, loss of water or gas, or being told to stay indoors" },
    { id: "b", title: "Scenario B: Leaving with notice", subtitle: "About 1–2 hours to leave by car, for example for flood or wildfire" },
    { id: "c", title: "Scenario C: House fire", subtitle: "Leaving instantly" },
    { id: "upkeep", title: "Keeping things up to date", subtitle: "" },
    { id: "numbers", title: "Useful UK numbers", subtitle: "" }
  ],

  SECTIONS: [
    /* ============================================== GETTING READY */
    {
      id: "know_risks", group: "ready", title: "Know your risks",
      intro: "This section is about working out which emergencies are most likely where we live, so we can put our effort where it matters most.",
      guidance: `
- Find out what is likely where you live: flooding, storms, long power cuts, extreme weather, wildfire, and any nearby industrial or nuclear sites.
- Being prepared lets help go first to those who need it most.
`,
      plan: [
        { id: "main_risks", label: "What do we think our main risks are?", help: "For example flooding, storms, long power cuts, extreme weather, wildfire, or a nearby industrial or nuclear site." },
        { id: "likely_scenarios", label: "Which scenarios are most likely for us, and why?", help: "Scenario A: staying at home. Scenario B: leaving with notice. Scenario C: a house fire." },
        { id: "nearby_sites", label: "Are there any industrial or nuclear sites near us? If so, which?" },
        { id: "risk_sources", label: "Where did we find out about our local risks?" }
      ],
      have: [
        { id: "risks_checked", label: "Have we found out which risks are likely where we live?" },
        { id: "flood_checked", label: "Have we checked our flood risk?" },
        { id: "sites_checked", label: "Have we checked for nearby industrial or nuclear sites?" },
        { id: "scenarios_chosen", label: "Have we agreed which scenarios are most likely for us?" }
      ],
      storedLabel: "Where do we keep our notes about local risks?",
      checkLabel: "How do we keep our view of the risks up to date?"
    },
    {
      id: "staying_informed", group: "ready", title: "Staying informed",
      intro: "This section covers how we will get reliable news and official instructions when the power, phones or internet are not working.",
      guidance: `
- Keep an **FM radio that works without mains power (battery or wind-up)**, with **spare batteries**. A car radio is a fallback.
- Write down the frequencies of the national and local stations that carry emergency news.
- Emergency alerts may be sent to mobile phones in the area. Keep phones charged and alerts switched on.
- Follow official sources and trusted broadcasters. Be wary of anything that provokes a strong reaction, check it against official sources, and don't pass on rumours. Criminals use emergencies for scams.
`,
      plan: [
        { id: "stations", label: "Which radio stations carry emergency news for us, and on what frequencies?" },
        { id: "official_sources", label: "Which official sources and trusted broadcasters will we follow?" },
        { id: "rumours", label: "How will we check information before acting on it or passing it on?" }
      ],
      have: [
        { id: "fm_radio", label: "Do we have an FM radio that works without mains power (battery or wind-up)?" },
        { id: "radio_batteries", label: "Do we have spare batteries for the radio?" },
        { id: "car_radio", label: "Do we have a car radio we could use as a fallback?" },
        { id: "frequencies", label: "Do we have the station frequencies written down?" },
        { id: "alerts_on", label: "Do we have emergency alerts switched on on our phones?" },
        { id: "phones_charged", label: "Do we have a habit of keeping our phones charged?" }
      ],
      storedLabel: "Where are the radio, spare batteries and the list of frequencies kept?",
      checkLabel: "How do we check the radio works?"
    },
    {
      id: "contacts", group: "ready", title: "Contacts",
      intro: "This section is about keeping the numbers we need on paper and on our phones, in case phones go flat or networks go down.",
      guidance: `
- Keep a **paper list** of important numbers (family, neighbours, GP, pharmacy, vet, insurer, utilities), because phones may be flat or networks down. Keep it somewhere easy to find in the dark.
- Add emergency contacts and medical information to your phone (ICE or Medical ID).
- When networks are busy, only call if you need help.
`,
      plan: [
        { id: "who_on_list", label: "Who is on our paper list of important numbers?", help: "For example family, neighbours, GP, pharmacy, vet, insurer and utilities. Write the names of the people or services here; the numbers themselves go on the paper list." },
        { id: "ice", label: "How have we set up emergency contacts and medical information (ICE or Medical ID) on our phones?" },
        { id: "busy_networks", label: "What have we agreed about using our phones when networks are busy?" }
      ],
      have: [
        { id: "paper_list", label: "Do we have a paper list of important numbers?" },
        { id: "list_complete", label: "Does the list include family, neighbours, GP, pharmacy, vet, insurer and utilities?" },
        { id: "list_findable", label: "Is the list kept somewhere easy to find in the dark?" },
        { id: "ice_set_up", label: "Do we have emergency contacts and medical information on our phones (ICE or Medical ID)?" }
      ],
      storedLabel: "Where is the paper list kept?",
      checkLabel: "How do we check the list is up to date?"
    },
    {
      id: "cash", group: "ready", title: "Cash and payments",
      intro: "This section covers keeping enough cash and spare bank cards to buy essentials when card machines and cash machines are not working.",
      guidance: `
- Card payments and cash machines may not work in a power cut or cyber attack.
- Keep **£100 per person in cash, in mixed notes and coins**, plus more than one bank card with known PINs.
- Use the cash now and then so it isn't forgotten, and top it back up.
`,
      plan: [
        { id: "cash_amount", label: "How much cash do we aim to keep, and in what mix of notes and coins?", help: "The guidance suggests £100 per person." },
        { id: "cards", label: "Which spare bank cards do we have?", help: "Never write a card number or PIN in this tool." },
        { id: "pins_known", type: "yesno", label: "Do we both know the PINs for the cards we would use?", help: "Answer yes or no only. Never write a PIN here." },
        { id: "rotation", label: "How will we use and top up the cash so it is not forgotten?" }
      ],
      have: [
        { id: "cash_100", label: "Do we have £100 per person in cash?" },
        { id: "mixed", label: "Is the cash in mixed notes and coins?" },
        { id: "two_cards", label: "Do we have more than one bank card?" },

      intro: "This section is about staying warm if the heating stops, including setting up one warm room and using any heater safely.",
      guidance: `
- Homes get cold quickly when the heating stops.
- Have **warm clothing** (wool layers, thick socks, hats, gloves, scarves), **blankets, duvets, sleeping bags and sleeping mats**. These are core items.
- **Gather in one warm room.** Close its doors, hang blankets over the windows, and put rugs on the floor.
- **Using a portable gas heater.** Fire services advise using only heaters designed for indoor use. If a portable camping-type gas heater is the only heat available in a long, freezing outage, keep the risk as low as possible:
  - use it in **short bursts** to top up the warm room, not continuously;
  - stand it on a **fireproof mat**, at least **1 metre** from furniture, curtains, people and dogs;
  - keep a **window partly open** and a **carbon monoxide alarm** in the room;
  - **never leave it unattended**, never move it while it's lit, and **switch it off before sleeping**;
  - check the seal and fitting each time, and don't use a damaged unit;
  - change cartridges outdoors.
- **Gas cartridges in the cold.** Butane works poorly below freezing. Keep spare cartridges cool and dry, below 50 °C, but above 0 °C; in freezing weather, store them in the warm room, away from the heater.
- **Carbon monoxide** has no smell. Headache, dizziness, nausea, confusion and tiredness are warning signs. If you suspect it, or the alarm sounds: switch the appliance off, get into fresh air, and call 999 if anyone feels unwell.
- If the home becomes too cold, go and stay with family or friends.

    {
      id: "chem_nuclear", group: "a", title: "Chemical or nuclear incident: being told to stay indoors",
      intro: "This section covers what to do if we are told to go in, stay in and tune in because of a chemical or nuclear incident, including iodine tablets.",
      guidance: `
**Go in, stay in, tune in.** Leave only if you're told to. The exception is a chemical release close to you outdoors, when you should move away from it, upwind if you can.

**If you were outside when it happened:**
- Go into the nearest solid building, even if it isn't your home.
- Take off your outer clothing carefully, without pulling it over your head. Cut it off if you need to. This removes most of any contamination.
- Put the clothes and shoes in a bag and leave it outside or in a separate room.
- Don't eat, drink or smoke until you have washed.
- **Chemical:** blot or brush the substance off the skin, then rinse with plenty of water if the skin itches or hurts.
- **Radiation:** shower with soap and shampoo (no conditioner), then put on clean clothes that were stored indoors.
- Wash any pet that was outside (wear gloves) and keep it indoors.

**Sealing the house:**
- Close all doors and windows, including trickle vents.
- Switch off fans, extractor fans, air conditioning, and any heating or ventilation that draws in outside air.
- Bring pets in only if they're with you. Don't go out to look for one.

**Which room to use:**
- UK guidance says go to the **middle of the building, away from outside doors, windows and walls**.
- **If every room has windows:** choose the room with the **fewest and smallest windows**, on the side of the house away from the incident, and keep away from the glass.
- **Chemical:** an upstairs room is better, because many chemicals are heavier than air.
- **Radiation:** a central room on a lower floor is better.

**While sheltering:**
- Tune in to local radio, TV or official websites, and stay in until you're told it's safe. That's usually **1–2 days** for radiation, or a number of hours for a chemical release.
- Food and drink already indoors, covered food and **mains tap water are safe** unless you're told otherwise. Don't eat garden produce or drink water stored outside or from wells until advised.
- Don't go out to collect children from school; schools will look after them.
- Use phones only when needed, to keep lines free. Call **999** in a real emergency.
- If you need medicines, call **NHS 111** rather than going out.

**Iodine tablets**
- Stable iodine (potassium iodate) **protects only the thyroid gland, and only against radioactive iodine**. It does nothing against other radiation.
- **Take it only when officially told to, and only the tablets provided.** Never use iodised salt or other products.
- Tablets are issued in advance only to homes very close to a nuclear site. Further out, they're handed out in an emergency if needed.
- **Timing matters:**
  - one dose protects for 24 hours;
  - it works best taken up to 24 hours before, or within 2 hours after, exposure;
  - it still helps up to 8 hours after;
  - don't start it more than 24 hours after exposure.
- Adults and children over 12 usually take 2 tablets (85 mg tablets). **Follow the leaflet with the tablets you are given.**
- People with an iodine allergy, or certain rare skin and blood vessel conditions, should not take it.
- There is no official UK advice to buy your own. The plan is to follow official instructions.
`,

|---|---|

|---|---|

    if (obj.format !== FORMAT) return { ok: false, message: notOurs };
    if (typeof obj.formatVersion !== "number" || obj.formatVersion < 1) return { ok: false, message: damaged };
    if (obj.formatVersion > FORMAT_VERSION) return { ok: false, message: "This file was made by a newer version of the Family plan tool, so this version cannot open it." };

    var out = emptyState(), skipped = 0;
    var src = isPlainObject(obj.sections) ? obj.sections : {};

      para("Subheading", "Guidance subheading", "Text_20_body", 'fo:margin-top="0.25cm" fo:keep-with-next="always"', 'fo:font-weight="bold"') +
      para("Label", "Answer label", "Text_20_body", 'fo:margin-top="0.25cm" fo:margin-bottom="0.05cm" fo:keep-with-next="always"', 'fo:font-weight="bold" fo:color="#083a66"') +
      para("Answer", "Answer", "Text_20_body", 'fo:margin-left="0.5cm" fo:margin-bottom="0.2cm"', null) +
      para("Group_20_Intro", "Part introduction", "Text_20_body", null, 'fo:font-style="italic" fo:font-size="12pt"') +
      para("Empty", "Empty note", "Text_20_body", null, 'fo:font-style="italic" fo:color="#555555"') +
      para("List_20_Contents", "List Contents", "Standard", 'fo:margin-top="0cm" fo:margin-bottom="0.1cm" fo:line-height="115%"', null) +
      para("Table_20_Contents", "Table Contents", "Standard", 'fo:margin-top="0cm" fo:margin-bottom="0cm"', 'fo:font-size="10.5pt"', ' style:class="extra"') +
      para("Table_20_Heading", "Table Heading", "Table_20_Contents", null, 'fo:font-weight="bold"', ' style:class="extra"') +
      para("Footer", "Footer", "Standard", 'fo:text-align="center"', 'fo:font-size="9pt" fo:color="#444444"', ' style:class="extra"') +
      '<style:style style:name="Strong_20_Emphasis" style:display-name="Strong Emphasis" style:family="text"><style:text-properties fo:font-weight="bold"/></style:style>' +
      '<style:style style:name="Emphasis" style:family="text"><style:text-properties fo:font-style="italic"/></style:style>' +
      outline +
      '<text:list-style style:name="L1" style:display-name="Guidance bullets">' + bulletLevel(1, "•", 0.7) + bulletLevel(2, "–", 1.4) + bulletLevel(3, "◦", 2.1) + "</text:list-style>" +
      "</office:styles>" +
      '<office:automatic-styles><style:page-layout style:name="pm1"><style:page-layout-properties fo:page-width="21cm" fo:page-height="29.7cm" style:print-orientation="portrait" fo:margin-top="1.8cm" fo:margin-bottom="1.2cm" fo:margin-left="2cm" fo:margin-right="2cm"/>' +
      '<style:footer-style><style:header-footer-properties fo:min-height="0cm" fo:margin-top="0.4cm"/></style:footer-style></style:page-layout></office:automatic-styles>' +
      '<office:master-styles><style:master-page style:name="Standard" style:page-layout-name="pm1"><style:footer>' +
      P("Footer", xmlEsc(footerText) + ' · page <text:page-number text:select-page="current">1</text:page-number>') +
      "</style:footer></style:master-page></office:master-styles></office:document-styles>";
  }

  function metaXml(title, now) {
    var iso = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    return '<?xml version="1.0" encoding="UTF-8"?>\n<office:document-meta ' + NS + ' office:version="1.3"><office:meta>' +
      "<meta:generator>" + APP_NAME + " 1</meta:generator><dc:title>" + xmlEsc(title) + "</dc:title><dc:language>en-GB</dc:language>" +
      "<meta:creation-date>" + iso + "</meta:creation-date><dc:date>" + iso + "</dc:date></office:meta></office:document-meta>";
  }

  var MANIFEST = '<?xml version="1.0" encoding="UTF-8"?>\n<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.3">' +
    '<manifest:file-entry manifest:full-path="/" manifest:version="1.3" manifest:media-type="application/vnd.oasis.opendocument.text"/>' +
    '<manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/>' +
    '<manifest:file-entry manifest:full-path="styles.xml" manifest:media-type="text/xml"/>' +
    '<manifest:file-entry manifest:full-path="meta.xml" manifest:media-type="text/xml"/>' +
    "</manifest:manifest>";

  /* ---- minimal ZIP writer (STORE method, CRC-32) ---- */
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  /* files: [{name, data: string}] in order. Returns Uint8Array. */
  function makeZip(files, when) {
    var enc = new TextEncoder();
    var dosTime = (when.getHours() << 11) | (when.getMinutes() << 5) | Math.floor(when.getSeconds() / 2);
    var dosDate = ((when.getFullYear() - 1980) << 9) | ((when.getMonth() + 1) << 5) | when.getDate();
    var locals = [], centrals = [], offset = 0;
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      var h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 10, true); h.setUint16(6, 0, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      locals.push(new Uint8Array(h.buffer), name, data);
      var c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 10, true); c.setUint16(8, 0, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
      c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true);
      c.setUint32(42, offset, true);
      centrals.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    });
    var cdSize = centrals.reduce(function (a, b) { return a + b.length; }, 0);
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(4, 0, true); e.setUint16(6, 0, true);
    e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cdSize, true); e.setUint32(16, offset, true); e.setUint16(20, 0, true);
    var parts = locals.concat(centrals, [new Uint8Array(e.buffer)]);
    var total = parts.reduce(function (a, b) { return a + b.length; }, 0);
    var out = new Uint8Array(total), pos = 0;
    parts.forEach(function (p) { out.set(p, pos); pos += p.length; });
    return out;
  }

  function makeOdt(doc, title, footer, now) {
    return makeZip([
      { name: "mimetype", data: "application/vnd.oasis.opendocument.text" },
      { name: "META-INF/manifest.xml", data: MANIFEST },
      { name: "content.xml", data: contentXml(doc) },
      { name: "styles.xml", data: stylesXml(footer) },
      { name: "meta.xml", data: metaXml(title, now) }
    ], now);
  }

  function relevantGroups() {
    return GROUPS.map(function (g) {
      return { group: g, sections: sectionsIn(g).filter(function (s) { var d = peek(s.id); return !(d && d.notRelevant); }) };
    }).filter(function (x) { return x.sections.length; });
  }

  /* ---- 1. Family plan ---- */
  function buildPlanOdt(now) {
    now = now || new Date();
    var doc = new OdfDoc();
    doc.add(P("Title", "Family plan"));
    doc.add(P("Subtitle", "Generated on " + xmlEsc(formatDateTime(now))));
    doc.add(P("Text_20_body", "This is our household emergency plan. Everything is planned for 7 days. Each section explains what it covers, gives the general guidance, and then sets out our plan: our decisions, information and preparations."));
    doc.add(P("Text_20_body", "Keep a printed copy where everyone knows to find it, and review it whenever our circumstances change."));
    var groups = relevantGroups();
    if (!groups.length) {
      doc.add(P("Empty", "Every section has been marked as not relevant, so there is nothing to show."));
    } else {
      doc.add(H(2, "What this plan covers"));
      doc.add('<text:list text:style-name="L1">');
      groups.forEach(function (x) {
        doc.add("<text:list-item>" + P("List_20_Contents", '<text:span text:style-name="Strong_20_Emphasis">' + xmlEsc(x.group.title) + "</text:span>") +
          (isSolo(x.group) ? "" : "<text:list>" + x.sections.map(function (s) {
            return "<text:list-item>" + P("List_20_Contents", xmlEsc(s.title + " (" + PROGRESS_LABELS[sectionProgress(s).status].text.toLowerCase() + ")")) + "</text:list-item>";
          }).join("") + "</text:list>") + "</text:list-item>");
      });
      doc.add("</text:list>");
    }

    groups.forEach(function (x) {
      var g = x.group, solo = isSolo(g);
      doc.add(H(1, xmlEsc(g.title), "H1break"));
      if (g.subtitle) doc.add(P("Group_20_Intro", xmlEsc(g.subtitle)));
      x.sections.forEach(function (s) {
        var lv = solo ? 2 : 3;
        if (!solo) doc.add(H(2, xmlEsc(s.title)));
        doc.add(H(lv, "About this section"));
        doc.add(P("Text_20_body", xmlEsc(s.intro)));
        doc.add(H(lv, "General guidance"));
        guidanceToOdf(doc, guidanceOf(s));
        doc.add(H(lv, "Our plan"));
        planAnswersToOdf(doc, s);
      });
    });
    return makeOdt(doc, "Family plan", "Family plan, generated on " + formatDate(now), now);
  }

  function qa(doc, label, answer) {
    if (isBlank(answer)) return false;
    doc.add(P("Label", xmlEsc(label)));
    doc.add(P("Answer", odfText(String(answer).trim())));
    return true;
  }

  function planAnswersToOdf(doc, s) {
    var d = peek(s.id) || emptySection();
    var any = false;
    s.plan.forEach(function (q) { if (qa(doc, q.label, d.plan[q.id])) any = true; });
    if (qa(doc, NOTES_LABEL, d.notes)) any = true;

    var rows = [], unanswered = 0;
    function addRow(label, a, custom) {
      if (!a || (!a.status && isBlank(a.note))) { unanswered++; return; }
      if (!a.status) unanswered++;
      rows.push({
        cells: [xmlEsc(label) + (custom ? ' <text:span text:style-name="Emphasis">(our own item)</text:span>' : ""), xmlEsc(a.status ? statusLabel(a.status) : "Not answered"), odfText(a.note || "")],
        cellStyles: ["CellBody", statusCellStyle(a.status), "CellBody"]
      });
    }
    s.have.forEach(function (h) { addRow(h.label, d.have[h.id], false); });
    d.custom.forEach(function (c) { addRow(c.label, c, true); });
    if (rows.length) {
      any = true;
      doc.add(P("Label", "Resources, tools and equipment"));
      doc.table([9, 3, 5], ["Do we have …?", "Status", "Note"], rows);
      if (unanswered) doc.add(P("Empty", unanswered + (unanswered === 1 ? " item has" : " items have") + " not been answered yet. See the to-do list."));
    }
    if (qa(doc, storedLabel(s), d.stored)) any = true;
    if (qa(doc, checkLabel(s), d.checkHow)) any = true;
    if (qa(doc, oftenLabel(s), d.checkOften)) any = true;
    if (!any) doc.add(P("Empty", "We have not filled in this section yet."));
  }

  /* ---- 2. To-do list ---- */
  function buildTodoOdt(now) {
    now = now || new Date();
    var doc = new OdfDoc();
    var items = todoItems();
    var t = todoCounts(items);
    doc.add(P("Title", "To-do list"));
    doc.add(P("Subtitle", "Generated on " + xmlEsc(formatDateTime(now))));
    doc.add(P("Text_20_body", "Every “Do we have …?” item from the relevant sections of our family plan, with its status and any note. Work through the list, update the tool, then download a fresh list."));
    doc.add(H(1, "Colour key and counts"));
    doc.table([3, 4.5, 2.5], ["Colour", "Status", "Items"], [
      { cells: ["Green", "Yes", String(t.yes)], cellStyle: statusCellStyle("yes") },
      { cells: ["Amber", "In progress", String(t.progress)], cellStyle: statusCellStyle("progress") },
      { cells: ["Red", "No", String(t.no)], cellStyle: statusCellStyle("no") },
      { cells: ["Red", "Not sure", String(t.unsure)], cellStyle: statusCellStyle("unsure") },
      { cells: ["White", "Not answered", String(t.none)], cellStyle: statusCellStyle("none") },
      { cells: ["", '<text:span text:style-name="Strong_20_Emphasis">Total</text:span>', '<text:span text:style-name="Strong_20_Emphasis">' + items.length + "</text:span>"] }
    ]);
    if (!items.length) doc.add(P("Empty", "There are no items: every section has been marked as not relevant."));
    relevantGroups().forEach(function (x) {
      var rows = [];
      x.sections.forEach(function (s) {
        items.filter(function (it) { return it.section === s; }).forEach(function (it) {
          rows.push({
            cells: [xmlEsc(s.title), xmlEsc(it.label) + (it.custom ? ' <text:span text:style-name="Emphasis">(our own item)</text:span>' : ""),
              '<text:span text:style-name="Strong_20_Emphasis">' + xmlEsc(it.status ? statusLabel(it.status) : "Not answered") + "</text:span>", odfText(it.note)],
            cellStyle: statusCellStyle(it.status)
          });
        });
      });
      if (!rows.length) return;
      doc.add(H(1, xmlEsc(x.group.title)));
      doc.table([3.2, 6.8, 3.2, 3.8], ["Section", "Item", "Status", "Note"], rows);
    });
    return makeOdt(doc, "To-do list", "To-do list, generated on " + formatDate(now), now);
  }

  var ODT_TYPE = "application/vnd.oasis.opendocument.text";
  function downloadPlan() {
    if (saveTimer) saveNow();
    var now = new Date(), name = "family-plan-" + fileDate(now) + ".odt";
    downloadBlob(new Blob([buildPlanOdt(now)], { type: ODT_TYPE }), name);
    notice("Our family plan has been saved as “" + name + "” in the Downloads folder. Double-click it to open it in LibreOffice Writer.", "ok");
  }
  function downloadTodo() {
    if (saveTimer) saveNow();
    var now = new Date(), name = "family-plan-to-do-" + fileDate(now) + ".odt";
    downloadBlob(new Blob([buildTodoOdt(now)], { type: ODT_TYPE }), name);
    notice("Our to-do list has been saved as “" + name + "” in the Downloads folder. Double-click it to open it in LibreOffice Writer.", "ok");
  }

  /* ------------------------------------------------------------------ */
  /* Start-up                                                           */
  /* ------------------------------------------------------------------ */

  function loadInto(saved) {
    if (!saved) return;
    var r = validateBackup(saved);
    if (!r.ok) return;
    state = r.data;
    state.savedAt = typeof saved.savedAt === "string" ? saved.savedAt : null;
    if (typeof saved.lastView === "string") currentView = saved.lastView;
  }

  function init() {
    if (!SECTIONS.length) {
      $("view").appendChild(el("p", { className: "notice notice-error", text: "The sections could not be loaded. If the content block was edited recently, check it for a missing comma or quotation mark." }));
      return;
    }
    $("btn-save-file").addEventListener("click", saveToFile);
    $("btn-open").addEventListener("click", function () { $("file-input").click(); });
    $("btn-reset").addEventListener("click", startAgain);
    $("file-input").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      openFile(f);
    });
    storage.init().then(function () { return storage.load(); }).then(function (saved) {
      loadInto(saved);
      renderSidebar();
      showSavedTime();
      if (storage.backend === "none") setSaveStatus("This browser cannot keep answers here. Use “Save to file” often.", true);
      go(currentView, { noFocus: true, noSave: true });
      window.FamilyPlanTool.ready = true;
    });
  }

  // A little access for testing and troubleshooting.
  window.FamilyPlanTool = {
    ready: false,
    storageBackend: function () { return storage.backend; },
    flushSave: function () { return saveNow(); },
    buildPlanOdt: buildPlanOdt,
    buildTodoOdt: buildTodoOdt,
    getState: function () { return clone(state); }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
