<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Household Emergency Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the questions</a>

  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1 class="app-title">Household Emergency Planner</h1>
        <p class="save-status" id="save-status" role="status" aria-live="polite">Not saved yet</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn" id="btn-backup">Save backup</button>
        <button type="button" class="btn" id="btn-open">Open a saved file</button>
        <button type="button" class="btn btn-danger-outline" id="btn-reset">Start again</button>
        <input type="file" id="file-input" accept=".json,application/json" hidden>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Sections">
        <div class="progress" id="progress">
          <p class="progress-text" id="progress-text">0 of 9 sections have answers</p>
          <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
        <ol class="section-list" id="section-list"></ol>
      </nav>

      <main id="main" class="main" tabindex="-1">
        <div id="notice" class="notice" role="alert" hidden></div>
        <div id="view"></div>
      </main>
    </div>
  </div>

  <!-- The printed plan. Hidden on screen; it is the only thing printed. -->
  <div id="print-area" class="print-area"></div>

  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <h2 id="dialog-title" class="dialog-title"></h2>
    <div id="dialog-message" class="dialog-message"></div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="dialog-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="dialog-ok">OK</button>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">This planner needs JavaScript switched on in your web browser.</p>
  </noscript>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
